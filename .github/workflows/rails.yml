# This workflow uses actions that are not certified by GitHub.  They are
# provided by a third-party and are governed by separate terms of service,
# privacy policy, and support documentation.
#
# This workflow will install a prebuilt Ruby version, install dependencies, and
# run tests and linters.
name: "Ruby on Rails CI"
on: push
jobs:
  rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:latest
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
      redis:
        image: redis:7.2-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      # config/database.yml appends the prspec worker number to the test database name, so
      # connect by parts here: a DATABASE_URL would pin every worker to one shared database.
      DB_HOST: localhost
      DB_USERNAME: rails
      DB_PASSWORD: password
      REDIS_URL: "redis://localhost:6379"
      WORKERS: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # Add or replace dependency steps here
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # JavaScript/feature specs use the Chrome that ships on ubuntu-latest. Do not install chromium-browser
      # with apt: on Ubuntu 24.04 it downloads a snap, and a Snap Store timeout fails the whole job.
      - name: Verify browser
        run: google-chrome --version && chromedriver --version
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 libvips42
      # Test data is disposable: trade durability for speed (all three settings reload on SIGHUP).
      - name: Tune Postgres for tests
        run: |
          PGPASSWORD=password psql -h localhost -U rails -d postgres \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
      # One database per prspec worker: <name>_test, <name>_test2, ... each loaded from db/schema.rb.
      # One process per worker, because db:parallel:prepare purges from a process that already holds
      # a session on the first worker's database and fails with "being accessed by other users".
      - name: Prepare parallel test databases
        run: |
          rm -f tmp/pids/server.pid
          pids=()
          for n in "" $(seq 2 "$WORKERS"); do
            TEST_ENV_NUMBER=$n bundle exec rails db:create db:schema:load &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
      - name: Run tests in parallel
        run: rm -f tmp/pids/server.pid && bundle exec prspec spec

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Lint Ruby files with Rubocop
        run: bundle exec rubocop --parallel

  i18n-health:
    runs-on: ubuntu-latest
    # The auto-fix commits to the branch tip, so only the newest push's run may proceed.
    concurrency:
      group: i18n-health-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      HAS_PUSH_TOKEN: ${{ secrets.BTS_ROBOT_PUSH_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.BTS_ROBOT_PUSH_TOKEN || github.token }}
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # Normalizing (key order and formatting) is deterministic and safe to auto-fix.
      - name: Normalize locale files
        id: normalize
        run: |
          bundle exec i18n-tasks normalize
          if git diff --quiet -- config/locales; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- config/locales
          fi
      - name: Commit normalized locale files (GitHub-signed)
        id: autofix
        if: >-
          steps.normalize.outputs.changed == 'true'
          && env.HAS_PUSH_TOKEN == 'true'
          && github.ref_name != github.event.repository.default_branch
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ secrets.BTS_ROBOT_PUSH_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          bin/ci-signed-commit "chore(i18n): normalize locale files" config/locales
      - name: Fail if normalization could not be committed
        if: steps.normalize.outputs.changed == 'true' && steps.autofix.outcome != 'success'
        run: |
          echo "::error::Locale files need normalization. Run bundle exec i18n-tasks normalize and commit config/locales."
          exit 1
      - name: Run i18n health checks
        run: bundle exec i18n-tasks health

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Generate binstubs
        run: bundle binstubs bundler-audit --force
      - name: Security audit dependencies
        run: bundle exec bundler-audit --update
      - name: Security audit application code
        run: bundle exec brakeman -q -w2
