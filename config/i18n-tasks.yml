base_locale: en

locales:
  - en
  - es
  - fr

data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/**/%{locale}.yml
  write:
    - config/locales/%{locale}.yml

search:
  paths:
    - app
    - lib
    - config
  only:
    - "*.rb"
    - "*.erb"
    - "*.haml"
    - "*.slim"
    - "*.js"
    - "*.yml"
  exclude:
    - "spec/**"
    - "test/**"
    - "tmp/**"
    - "log/**"
    - "vendor/**"
    - "coverage/**"

# Keys provided by the Better Together engine locales (used by copied CE views).
ignore_missing:
  - 'globals.*'
  - 'better_together.*'
  - 'partners.confirm_delete' # used by the copied CE communities show view; the key comes from the CE gem
  - 'helpers.toolbar.aria_label' # used by the copied CE posts form; the key comes from the CE gem
  - 'hints.categories.select_multiple' # used by the copied CE posts form; the key comes from the CE gem

ignore_unused:
  - "better_together.shared.map.**" # used by the shared map partial copied from CE (until the CE pin includes it)
  - "better_together.community_subtypes.*" # read by BetterTogether::CommunitySubtype.community_subtype_label
  - "actions.*"
  # Keys looked up with an interpolated segment, e.g. t("...kinds.#{election.jurisdiction}"). i18n-tasks 1.2 no longer
  # infers these as used, so each family is listed here.
  - "newfoundland_labrador_online.elections.index.kinds.*"
  - "newfoundland_labrador_online.elections.index.titles.*"
  - "newfoundland_labrador_online.elections.show.kinds.*"
  - "newfoundland_labrador_online.municipal_elections.show.offices.*"
  - "newfoundland_labrador_online.municipal_meetings.index.documents.*"
  - "newfoundland_labrador_online.municipalities.statuses.*"
  - "newfoundland_labrador_online.parties.index.titles.*"
  - "newfoundland_labrador_online.states.show.tabs.*"
  - "globals.**"
  - "date.**"
  - "datetime.**"
  - "errors.**"
  - "helpers.**"
  - "hints.resource.**"
  - "journey_items.**"
  - "journeys.**"
  - "number.**"
  - "support.**"
  - "time.**"
  - "activerecord.attributes.**"
  - "activerecord.errors.**"
  - "activerecord.errors.messages.**"
  - "activerecord.errors.models.**"
  - "activerecord.models.**"
